name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: npm ci
      - run: python -m pip install -r services/scheduler/requirements-dev.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -w @focusflow/api
      - run: python -m pytest services/scheduler/tests
      - run: python -m ruff check services/scheduler
      - run: npm run build
      - run: python -m services.scheduler.focusflow_scheduler.training --rows 12000

  container:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t focusflow-app .
